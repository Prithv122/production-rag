[project]
name = "production-rag"
version = "0.1.0"
description = "Hybrid BM25 + dense retrieval over DuckDB, dbt and Dagster documentation with cross-encoder reranking and cited answers - where retrieval quality is measured, not asserted."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

# Console entry points need a real build backend: a uv virtual project
# ([tool.uv] package = false) installs nothing, so the documented command fails
# with "No module named ..." even while tests pass (pytest's pythonpath hides it).
[project.scripts]
production-rag = "production_rag.cli:main"

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
]
ann = [
    "faiss-cpu>=1.15",
]
pgvector = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Keep this path and the [project.scripts] target above in step when renaming the package.
[tool.hatch.build.targets.wheel]
packages = ["src/production_rag"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs the real embedding model or the network; deselected in CI's fast job",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
